<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Kexin Liu Blog hidden</title>
  <style>
      :root { --bg: #fafafa; --text: #1c1917; --accent: #226808; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      body * { font-family: inherit !important; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .navbar {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 2rem 1rem;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 100;
      }
      .nav-link {
        color: #57534e;
        text-decoration: none;
        font-weight: 500;
        font-size: 1.1rem;
        padding-bottom: 0.25rem;
        border-bottom: 2px solid transparent;
      }
      .hidden-shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 5rem 2rem;
        text-align: center;
      }
      .hidden-shell h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin: 0 0 0.75rem;
      }
      .hidden-shell p {
        color: #57534e;
        margin: 0 0 1.5rem;
      }
      .home-link {
        display: inline-flex;
        border: 1px solid #e7e5e4;
        border-radius: 9999px;
        padding: 0.55rem 1rem;
      }
      
      .site-footer {
        color: #78716c;
        font-size: 0.9rem;
        margin: 2rem auto 0;
        max-width: 900px;
        padding: 2rem;
        text-align: center;
      }

    </style>
</head>
<body>
  <nav class="navbar"><a href="#section-0-imported-0" class="nav-link active" onclick="showSection('section-0-imported-0', event)">Home</a>
<a href="#section-1-imported-1" class="nav-link" onclick="showSection('section-1-imported-1', event)">Publication</a>
<a href="#section-2-imported-3" class="nav-link" onclick="showSection('section-2-imported-3', event)">Activity</a></nav>
  <main class="hidden-shell">
    <h1>Blog is currently hidden</h1>
    <p>This page is not currently shown on the public website.</p>
    <a class="home-link" href="index.html">Back to home</a>
  </main>
  <footer class="site-footer">© 2026 Kexin Liu. All rights reserved.</footer>
</body>
</html>
