<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Kexin Liu Blog hidden</title>
  <style>
      :root { --bg: #ffffff; --text: #1c1917; --accent: #226808; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.6;
      }
      body * { font-family: inherit !important; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .navbar {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 2rem 1rem;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 100;
      }
      .nav-link {
        color: #57534e;
        text-decoration: none;
        font-weight: 500;
        font-size: 1.1rem;
        padding-bottom: 0.25rem;
        border-bottom: 2px solid transparent;
      }
      .hidden-shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 5rem 2rem;
        text-align: center;
      }
      .hidden-shell h1 {
        font-size: 2rem;
        line-height: 1.2;
        margin: 0 0 0.75rem;
      }
      .hidden-shell p {
        color: #57534e;
        margin: 0 0 1.5rem;
      }
      .home-link {
        display: inline-flex;
        border: 1px solid #e7e5e4;
        border-radius: 9999px;
        padding: 0.55rem 1rem;
      }
      
      .site-footer {
        color: #78716c;
        font-size: 0.9rem;
        margin: 2rem auto 0;
        max-width: 900px;
        padding: 2rem;
        text-align: center;
      }

    
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(h1,h2,h3,h4,h5,h6) { font-weight:700; line-height:1.25; margin:1.5em 0 .65em; }
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(h1) { font-size:2em; }
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(h2) { font-size:1.5em; }
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(h3) { font-size:1.25em; }
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(h4,h5,h6) { font-size:1em; }
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(p) { margin:.75em 0; }
:is(.rich-content, .rsw-ce, .post-content, .generated-content-block) :where(strong,b) { font-weight:700; }
</style>
<style>
    .site-navigation .navigation-links { display:flex;justify-content:center;gap:2rem;flex-wrap:wrap; }
    .site-navigation { display:block; }
    .site-navigation details > summary { display:none;cursor:pointer;list-style:none; }
    .site-navigation details > summary::-webkit-details-marker { display:none; }
    .site-navigation a:focus-visible,.site-navigation summary:focus-visible { outline:2px solid var(--accent);outline-offset:4px; }
    .sidebar-profile { display:none; }
    @media(min-width:900px) {
      body[data-site-layout="sidebar"] { padding-left:256px; }
      body[data-site-layout="sidebar"] .site-navigation { position:fixed;inset:0 auto 0 0;width:256px;height:100vh;box-sizing:border-box;overflow-y:auto;padding:32px 24px;border-right:1px solid #d6d3d1;text-align:left; }
      body[data-site-layout="sidebar"] .sidebar-profile { display:block;margin-bottom:28px;overflow-wrap:anywhere; }
      .sidebar-profile img { display:block;width:80px;height:80px;object-fit:cover;border-radius:50%;margin-bottom:16px; }
      .sidebar-profile h1 { font-size:1.3rem;line-height:1.4;margin:0;font-weight:700; }
      body[data-site-layout="sidebar"] .navigation-links { flex-direction:column;align-items:stretch;gap:6px; }
      body[data-site-layout="sidebar"] .nav-link { display:block;padding:10px 12px;border-bottom:0;border-left:3px solid transparent;overflow-wrap:anywhere; }
      body[data-site-layout="sidebar"] .nav-link.active { border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent); }
      body[data-site-layout="sidebar"] .home-section .hero-avatar,body[data-site-layout="sidebar"] .home-section .hero-name { display:none; }
    }
    @media(max-width:899px) {
      body[data-site-layout] { padding-left:0; }
      .site-navigation { padding:12px 16px; }
      .site-navigation details > summary { display:flex;justify-content:space-between;align-items:center;min-height:44px;font-weight:600; }
      .site-navigation summary::after { content:'☰'; }
      .site-navigation details[open] summary::after { content:'×'; }
      .site-navigation .navigation-links { flex-direction:column;gap:4px;max-height:65vh;overflow-y:auto;padding:8px 0; }
      .site-navigation .nav-link { display:block;padding:10px 8px;min-height:44px;box-sizing:border-box;overflow-wrap:anywhere; }
    }
    @media print { body[data-site-layout="sidebar"] { padding-left:0; } .site-navigation { display:none; } }
    @media(prefers-reduced-motion:reduce) { .content-section { animation:none; } }
  </style></head>
<body data-site-layout="top">
  <nav class="navbar site-navigation" aria-label="Website navigation"><details open><summary>Menu</summary><div class="navigation-links"><a href="#section-0-imported-0" class="nav-link active" onclick="showSection('section-0-imported-0', event)">Home</a>
<a href="#section-1-imported-1" class="nav-link" onclick="showSection('section-1-imported-1', event)">Publication</a>
<a href="#section-2-imported-3" class="nav-link" onclick="showSection('section-2-imported-3', event)">Activity</a></div></details></nav><script>(function(){
    var nav=document.querySelector('.site-navigation'), menu=nav.querySelector('details'), summary=menu.querySelector('summary'), desktop=matchMedia('(min-width:900px)');
    function resize(){menu.open=desktop.matches;} resize(); desktop.addEventListener('change',resize);
    nav.addEventListener('click',function(event){if(event.target.closest('a')&&!desktop.matches){menu.open=false;summary.focus({preventScroll:true});}});
    nav.addEventListener('keydown',function(event){if(event.key==='Escape'&&!desktop.matches){menu.open=false;summary.focus();}});
  })();</script>
  <main class="hidden-shell">
    <h1>Blog is currently hidden</h1>
    <p>This page is not currently shown on the public website.</p>
    <a class="home-link" href="index.html">Back to home</a>
  </main>
  <footer class="site-footer">© 2026 Kexin Liu. All rights reserved.</footer>
</body>
</html>
